name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project LinkLauncher.xcodeproj \
            -scheme LinkLauncher \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- \
            test

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project LinkLauncher.xcodeproj \
            -scheme LinkLauncher \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Create DMG
        if: matrix.os == 'macos-15'
        run: scripts/make-dmg.sh

      - name: Upload DMG
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: LinkLauncher-dmg
          path: build/LinkLauncher-*.dmg
          if-no-files-found: error
