name: CI

# macOS minuty se u soukromého repozitáře počítají 10×, proto jen u PR (a ručně).
on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # Xcode 26 (Liquid Glass); starší Xcode lze dočasně přidat např. macos-15.
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project LinkLauncher.xcodeproj \
            -scheme LinkLauncher \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- \
            test

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project LinkLauncher.xcodeproj \
            -scheme LinkLauncher \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Create DMG
        if: matrix.os == 'macos-26'
        run: scripts/make-dmg.sh

      - name: Upload DMG
        if: matrix.os == 'macos-26'
        uses: actions/upload-artifact@v4
        with:
          name: LinkLauncher-dmg
          path: build/LinkLauncher-*.dmg
          if-no-files-found: error
