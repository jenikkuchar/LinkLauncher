name: LinkLauncher

options:
  bundleIdPrefix: cz.jenikkuchar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: cs
  # Kompatibilita s Xcode 15
  projectFormat: xcode15_0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Sign to Run Locally – bez placeného vývojářského účtu
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

targets:
  LinkLauncher:
    type: application
    platform: macOS
    sources:
      - path: LinkLauncher
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_NAME: LinkLauncher
        PRODUCT_BUNDLE_IDENTIFIER: cz.jenikkuchar.LinkLauncher
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/LinkLauncher.entitlements
        # App Sandbox vypnutý – aplikace čte soubory Chrome
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  LinkLauncherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: LinkLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.jenikkuchar.LinkLauncherTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LinkLauncher.app/Contents/MacOS/LinkLauncher"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  LinkLauncher:
    build:
      targets:
        LinkLauncher: all
        LinkLauncherTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LinkLauncherTests
    profile:
      config: Release
    archive:
      config: Release
